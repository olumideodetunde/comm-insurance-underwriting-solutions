# This is a Declarative Automation Bundle definition for project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: project
  uuid: 707f3961-e6b0-4f5b-b12e-0581039c099d

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-07bd4965-8a3a.cloud.databricks.com
    variables:
      catalog: commercial-insurance-underwriting-solution-catalog
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-07bd4965-8a3a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/olumideodetunde@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/olumideodetunde@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: commercial-insurance-underwriting-solution-catalog
      schema: prod
    permissions:
      - user_name: olumideodetunde@outlook.com
        level: CAN_MANAGE
