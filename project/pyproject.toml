[project]
name = "project"
version = "0.0.1"
authors = [{ name = "olumideodetunde@outlook.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "pandas>=2.3.3",
    "pympler>=1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
main = "project.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
# `spark` and `dbutils` are injected into scope at runtime by the Databricks
# pipeline/notebook environment rather than imported.
builtins = ["spark", "dbutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=project --cov-report=term-missing"

[tool.coverage.run]
source = ["src/project"]
